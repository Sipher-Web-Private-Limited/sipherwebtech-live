
name: Deploy SipherWebtech Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sipherwebtech-production
  cancel-in-progress: false

jobs:
  build-and-stage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify image files
        shell: bash
        run: |
          set -euo pipefail

          check_image() {
            local file="$1"

            if [ ! -f "$file" ]; then
              echo "ERROR: Image file not found: $file"
              exit 1
            fi

            if head -c 200 "$file" | grep -q "git-lfs.github.com/spec"; then
              echo "ERROR: Git LFS pointer found instead of actual image: $file"
              exit 1
            fi

            echo "Verified file exists: $file"
            file "$file"
          }

          check_image "public/images/logo/sw_logo.png"
          check_image "public/images/home/technology.png"

      - name: Build frontend
        env:
          VITE_CMS_API_URL: /api/v1
        run: npm run build

      - name: Verify built frontend images
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            "dist/images/logo/sw_logo.png" \
            "dist/images/home/technology.png"
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Image missing from build output: $file"
              exit 1
            fi

            if head -c 200 "$file" | grep -q "git-lfs.github.com/spec"; then
              echo "ERROR: Build contains Git LFS pointer: $file"
              exit 1
            fi

            echo "Build image verified: $file"
            file "$file"
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, ctype, curl, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Install Laravel production dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Verify Laravel
        working-directory: backend
        run: php artisan --version

      - name: Package release
        run: |
          set -eu
          tar -czf frontend.tar.gz -C dist .
          tar -czf backend.tar.gz \
            --exclude='.env' \
            --exclude='storage' \
            --exclude='database/database.sqlite' \
            --exclude='.git' \
            -C backend .

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.SIPHERWEBTECH_VPS_HOST }}
          VPS_PORT: ${{ secrets.SIPHERWEBTECH_VPS_PORT }}
          VPS_KEY: ${{ secrets.SIPHERWEBTECH_VPS_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release to Hostinger staging
        env:
          VPS_HOST: ${{ secrets.SIPHERWEBTECH_VPS_HOST }}
          VPS_USER: ${{ secrets.SIPHERWEBTECH_VPS_USER }}
          VPS_PORT: ${{ secrets.SIPHERWEBTECH_VPS_PORT }}
        run: |
          set -eu
          REMOTE_DIR="sipherwebtech-deploy-staging/${GITHUB_RUN_ID}"

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p ~/$REMOTE_DIR/frontend ~/$REMOTE_DIR/backend"

          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" \
            frontend.tar.gz backend.tar.gz \
            "$VPS_USER@$VPS_HOST:~/$REMOTE_DIR/"

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "tar -xzf ~/$REMOTE_DIR/frontend.tar.gz -C ~/$REMOTE_DIR/frontend &&
             tar -xzf ~/$REMOTE_DIR/backend.tar.gz -C ~/$REMOTE_DIR/backend &&
             test -f ~/$REMOTE_DIR/frontend/index.html &&
             test -f ~/$REMOTE_DIR/frontend/images/logo/sw_logo.png &&
             test -f ~/$REMOTE_DIR/frontend/images/home/technology.png &&
             test -f ~/$REMOTE_DIR/backend/artisan &&
             ! head -c 200 ~/$REMOTE_DIR/frontend/images/logo/sw_logo.png | grep -q 'git-lfs.github.com/spec' &&
             ! head -c 200 ~/$REMOTE_DIR/frontend/images/home/technology.png | grep -q 'git-lfs.github.com/spec' &&
             echo 'Staging upload verified successfully'"

      - name: Deploy to Hostinger Live Production
        env:
          VPS_HOST: ${{ secrets.SIPHERWEBTECH_VPS_HOST }}
          VPS_USER: ${{ secrets.SIPHERWEBTECH_VPS_USER }}
          VPS_PORT: ${{ secrets.SIPHERWEBTECH_VPS_PORT }}
        run: |
          set -eu
          REMOTE_DIR="sipherwebtech-deploy-staging/${GITHUB_RUN_ID}"

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "
            set -eu
            TARGET_CMS=\"\$HOME/sipherwebtech-cms\"
            TARGET_PUBLIC=\$(if [ -d \"\$HOME/domains/sipherwebtech.com/public_html\" ]; then echo \"\$HOME/domains/sipherwebtech.com/public_html\"; else echo \"\$HOME/public_html\"; fi)

            echo \"Deploying frontend to \$TARGET_PUBLIC\"
            echo \"Deploying backend to \$TARGET_CMS\"

            mkdir -p \"\$TARGET_PUBLIC\" \"\$TARGET_CMS\"

            # Deploy frontend build files to public_html
            cp -rf ~/$REMOTE_DIR/frontend/. \"\$TARGET_PUBLIC/\"

            # Deploy backend preserving server .env and storage/
            rsync -av --exclude='.env' --exclude='storage' --exclude='database/database.sqlite' ~/$REMOTE_DIR/backend/ \"\$TARGET_CMS/\"

            # Create storage symlink in public_html pointing to storage/app/public
            ln -sfn \"\$TARGET_CMS/storage/app/public\" \"\$TARGET_PUBLIC/storage\"

            # Run production database migrations and seeders
            cd \"\$TARGET_CMS\"
            php artisan migrate --force || true
            php artisan db:seed --force || true
            php artisan storage:link || true
            php artisan config:clear || true
            php artisan route:clear || true

            # Clean up staging directory
            rm -rf ~/$REMOTE_DIR
            echo 'Production deployment finished successfully!'
          "

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key