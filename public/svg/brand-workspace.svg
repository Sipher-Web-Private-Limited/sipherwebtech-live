<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-labelledby="ws-title ws-desc">
  <title id="ws-title">Unified brand identity inside a modern workspace</title>
  <desc id="ws-desc">A contemporary studio reception wall in deep navy with a yellow SW emblem, a crisp white desk holding a laptop displaying brand guidelines, stacked business cards, a branded notebook, and a lanyard pass.</desc>
  <defs>
    <linearGradient id="ws-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F7FC"/>
    </linearGradient>
    <linearGradient id="ws-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170A7A"/>
      <stop offset="1" stop-color="#100563"/>
    </linearGradient>
    <filter id="ws-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#100563" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="600" height="500" fill="url(#ws-bg)"/>

  <!-- Subtle architectural grid -->
  <g stroke="#100563" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- Reception Accent Wall Panel -->
  <g filter="url(#ws-shadow)">
    <rect x="76" y="42" width="448" height="206" rx="22" fill="url(#ws-navy)"/>
    <rect x="76" y="42" width="448" height="206" rx="22" fill="none" stroke="#FFE401" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- Wall Vertical Acoustic Slats -->
  <g fill="#FFFFFF" fill-opacity="0.06">
    <rect x="98" y="64" width="8" height="162" rx="4"/>
    <rect x="116" y="64" width="8" height="162" rx="4"/>
    <rect x="134" y="64" width="8" height="162" rx="4"/>
    <rect x="458" y="64" width="8" height="162" rx="4"/>
    <rect x="476" y="64" width="8" height="162" rx="4"/>
    <rect x="494" y="64" width="8" height="162" rx="4"/>
  </g>

  <!-- Illuminated Wall Brand Emblem -->
  <circle cx="300" cy="128" r="46" fill="#FFE401" fill-opacity="0.16"/>
  <rect x="262" y="90" width="76" height="76" rx="20" fill="#FFE401"/>
  <text x="300" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#100563" letter-spacing="-1">SW</text>
  <text x="300" y="198" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="4">SIPHER WEB STUDIO</text>
  <rect x="258" y="212" width="84" height="4" rx="2" fill="#FFE401"/>

  <!-- Studio Desk Surface -->
  <path d="M24 318 L576 318 L600 500 L0 500 Z" fill="#ECEEF8"/>
  <rect x="24" y="306" width="552" height="18" rx="9" fill="#FFFFFF" stroke="#100563" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Laptop displaying Brand Guidelines -->
  <g filter="url(#ws-shadow)">
    <!-- Screen -->
    <rect x="182" y="176" width="236" height="132" rx="12" fill="#100563"/>
    <rect x="190" y="184" width="220" height="114" rx="6" fill="#FFFFFF"/>
    <!-- Brand Guideline UI inside screen -->
    <rect x="200" y="194" width="66" height="94" rx="6" fill="#F6F7FC"/>
    <rect x="208" y="204" width="26" height="26" rx="6" fill="#100563"/>
    <text x="221" y="221" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#FFE401">SW</text>
    <rect x="208" y="238" width="48" height="6" rx="3" fill="#100563"/>
    <rect x="208" y="250" width="38" height="4" rx="2" fill="#100563" fill-opacity="0.3"/>
    <rect x="208" y="266" width="14" height="14" rx="7" fill="#100563"/>
    <rect x="226" y="266" width="14" height="14" rx="7" fill="#FFE401"/>
    <rect x="244" y="266" width="14" height="14" rx="7" fill="#E2E5F3"/>

    <rect x="276" y="194" width="124" height="44" rx="6" fill="#100563"/>
    <text x="288" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFE401">Brand System v2.4</text>
    <rect x="288" y="223" width="76" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="276" y="246" width="58" height="42" rx="6" fill="#FFE401"/>
    <text x="305" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#100563">Aa</text>
    <rect x="342" y="246" width="58" height="42" rx="6" fill="#F6F7FC" stroke="#100563" stroke-opacity="0.12"/>
    <rect x="352" y="258" width="38" height="5" rx="2.5" fill="#100563"/>
    <rect x="352" y="269" width="26" height="4" rx="2" fill="#100563" fill-opacity="0.35"/>

    <!-- Laptop Base -->
    <path d="M162 308 L438 308 L452 320 L148 320 Z" fill="#DFE3F2" stroke="#100563" stroke-opacity="0.14"/>
    <rect x="274" y="311" width="52" height="4" rx="2" fill="#100563" fill-opacity="0.25"/>
  </g>

  <!-- Branded Notebook + Pen (Right) -->
  <g filter="url(#ws-shadow)">
    <rect x="444" y="286" width="104" height="122" rx="10" transform="rotate(6 496 347)" fill="#100563"/>
    <rect x="454" y="294" width="10" height="106" rx="4" transform="rotate(6 496 347)" fill="#FFE401"/>
    <rect x="478" y="316" width="48" height="22" rx="5" transform="rotate(6 496 347)" fill="#FFFFFF" fill-opacity="0.14"/>
    <circle cx="502" cy="370" r="14" transform="rotate(6 496 347)" fill="#FFE401"/>
    <text x="502" y="374" text-anchor="middle" transform="rotate(6 496 347)" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#100563">SW</text>
  </g>

  <!-- Stacked Business Cards + Lanyard Pass (Left / Bottom-Right) -->
  <g filter="url(#ws-shadow)">
    <rect x="348" y="346" width="84" height="52" rx="8" transform="rotate(-5 390 372)" fill="#FFE401"/>
    <rect x="354" y="352" width="84" height="52" rx="8" fill="#FFFFFF" stroke="#100563" stroke-opacity="0.16"/>
    <rect x="364" y="362" width="22" height="22" rx="6" fill="#100563"/>
    <text x="375" y="377" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#FFE401">SW</text>
    <rect x="394" y="366" width="34" height="5" rx="2.5" fill="#100563"/>
    <rect x="394" y="376" width="24" height="4" rx="2" fill="#100563" fill-opacity="0.35"/>
  </g>

  <!-- Team ID Lanyard Pass -->
  <g filter="url(#ws-shadow)">
    <path d="M104 282 C112 316, 128 328, 134 338" fill="none" stroke="#100563" stroke-width="5" stroke-linecap="round"/>
    <rect x="116" y="336" width="66" height="92" rx="10" transform="rotate(-8 149 382)" fill="#FFFFFF" stroke="#100563" stroke-opacity="0.16"/>
    <rect x="122" y="342" width="54" height="22" rx="5" transform="rotate(-8 149 382)" fill="#100563"/>
    <circle cx="149" cy="382" r="12" transform="rotate(-8 149 382)" fill="#FFE401"/>
    <rect x="128" y="402" width="42" height="5" rx="2.5" transform="rotate(-8 149 382)" fill="#100563"/>
    <rect x="134" y="411" width="30" height="4" rx="2" transform="rotate(-8 149 382)" fill="#100563" fill-opacity="0.35"/>
  </g>
</svg>
